<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estonia Activities Directory | Outdoor, Water & Regional Escapes</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;

      --bg: #f8f9fa;
      --surface: #ffffff;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;

    header {

      top: 0;

    .nav-container {

      display: flex;

      gap: 0.5rem;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.25rem;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--primary-light); }
    .btn-submit {

    .btn-submit:hover { background: var(--primary-light); }

    .hero {

      color: white;
      text-align: center;
      padding: 4.5rem 1.5rem;

    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.8rem; }
    .hero p { font-size: 1.15rem; max-width: 760px; margin: 0 auto 1.8rem auto; opacity: 0.95; }
    
    /* Search & Filter Bar */
    .search-panel {

    .search-card {

      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .search-input {
      flex: 2;
      min-width: 220px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .filter-select {
      flex: 1;
      min-width: 160px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;

    /* Container & Directory */
    .main-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    .section-title {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .card-body { padding: 1.4rem; display: flex; flex-direction: column; flex-grow: 1; }

    .badge {

      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-paid { background: #e2f0d9; color: var(--primary); }
    .badge-free { background: #d8f3dc; color: #1b4332; }
    .badge-category { background: #edf2f4; color: #495057; }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--primary); }
    .card-region { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .card-desc { font-size: 0.92rem; color: #495057; margin-bottom: 1.25rem; flex-grow: 1; }
    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price-tag { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .btn-link {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-link:hover { background: var(--primary-light); }

    /* Informational Sections */
    .info-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.5rem;
      margin-top: 3.5rem;
      box-shadow: var(--shadow);
    }
    .info-section h2 { color: var(--primary); margin-bottom: 1rem; font-size: 1.7rem; }
